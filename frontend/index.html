    <link rel="manifest" href="/favicon/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- set the theme attribute synchronously, before React ever runs -->
    <script>
      (function () {
        var remembered = localStorage.getItem('rememberMe') === 'true';
        var storage = remembered ? localStorage : sessionStorage;
        var savedTheme = localStorage.getItem('task-force-theme');
        var theme = savedTheme === 'dim' || savedTheme === 'nord'
          ? savedTheme
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dim' : 'nord');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <title>TaskForce | Task Management for Developers</title>

    <meta name="description"
      content="TaskForce is a task management tool built specifically for individual software developers — track priorities, due dates, and progress without the operating cost of team-oriented tools." />
